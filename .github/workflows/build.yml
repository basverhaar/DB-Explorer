name: Build APK

on:
  push:
    paths-ignore:
      - "server/**"
      - ".github/workflows/database.yml"
  workflow_dispatch:

permissions:
  contents: write

# A newer push supersedes an older build, so releases are never published out of order.
concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest ships with the Android SDK (ANDROID_HOME); AGP fetches any missing platform.
      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk DB-Explorer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DB-Explorer-apk
          path: DB-Explorer.apk

      # The app reads version.json to offer in-app updates; versionCode matches the APK's.
      - name: Write version.json
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          notes = subprocess.run(["git", "log", "-1", "--pretty=%s"], capture_output=True, text=True).stdout.strip()
          run = int(os.environ["GITHUB_RUN_NUMBER"])
          json.dump({"versionCode": run, "versionName": f"1.0.{run}", "notes": notes,
                     "apk": "DB-Explorer.apk"}, open("version.json", "w"))
          PY
          cat version.json

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest DB-Explorer.apk version.json \
            --target "$GITHUB_SHA" \
            --title "DB Explorer (latest build)" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Download DB-Explorer.apk on your phone and open it to install."
