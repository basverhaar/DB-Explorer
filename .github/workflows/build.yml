name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk DB-Explorer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DB-Explorer-apk
          path: DB-Explorer.apk

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest DB-Explorer.apk \
            --target "$GITHUB_SHA" \
            --title "DB Explorer (latest build)" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Download DB-Explorer.apk on your phone and open it to install."
